<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="success.docTitle">Pledge Saved | Tenovice Fundraising</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="logo">
        <img src="images/logo_kagyu.svg" data-i18n-alt="common.logoAlt" alt="Karma Kagyu buddhism">
      </div>
    </header>

    <section class="success-card">
      <div class="lang-toggle corner" role="group" data-i18n-aria-label="common.langLabel" aria-label="Language">
        <button type="button" class="lang-btn" data-set-lang="cs">CS</button>
        <span class="lang-sep" aria-hidden="true">·</span>
        <button type="button" class="lang-btn" data-set-lang="en">EN</button>
      </div>
      <div class="success-icon">✓</div>
      <p class="page-eyebrow" data-i18n="success.thankYou">Thank you</p>
      <h1 data-i18n="success.heading">Your pledge was saved</h1>
      <p class="page-description" data-i18n="success.description">
        Thank you for supporting the Tenovice Project. You can now return to the homepage and see the refreshed campaign view.
      </p>

      <div class="success-actions">
        <a href="index.html" class="cta-button success-primary-link" data-i18n="common.backHome">Back to homepage</a>
        <a href="pledge.html" class="secondary-button" data-i18n="success.another">Make another pledge</a>
      </div>
    </section>

    <footer class="footer">
      <p data-i18n="footer.copyright">&copy; 2026 Tenovice Project. All rights reserved.</p>
    </footer>
  </div>

  <script src="i18n.js"></script>
</body>
</html>
